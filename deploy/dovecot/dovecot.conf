# Dovecot — V-zone Panel (conf minimale, sans conf.d/*.conf Ubuntu)
# Évite les passdb système (PAM/etc.) qui provoquent UNAVAILABLE.
protocols = imap pop3 lmtp
listen = *, ::
dict {
}

!include_try /usr/share/dovecot/protocols.d/*.protocol

# Auth
disable_plaintext_auth = no
auth_mechanisms = plain login
auth_username_format = %u
# Hashes dans vzone-users = $6$… (sans préfixe {SHA512-CRYPT})
default_pass_scheme = SHA512-CRYPT

passdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/vzone-users
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/vzone-users
}

# Mail
mail_location = maildir:~/
mail_privileged_group = vmail
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
}

# SSL (IMAPS 993) — snakeoil OK en local
ssl = yes
ssl_cert = </etc/ssl/certs/ssl-cert-snakeoil.pem
ssl_key = </etc/ssl/private/ssl-cert-snakeoil.key
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

# Services
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0660
    user = vmail
    group = vmail
  }
}
service imap {
}
service pop3 {
}

# Debug auth (utile tant que Roundcube échoue — retirer ensuite si besoin)
auth_verbose = yes
auth_debug = yes
mail_debug = no
