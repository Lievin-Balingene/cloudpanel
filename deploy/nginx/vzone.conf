# V-zone Panel — Nginx (compatible 1.18)
# - default_server = parking (PAS le panel) → un domaine client sans vhost
#   ne doit JAMAIS afficher /login du panel
# - panel = server_name explicites (IP, localhost, VZONE_PANEL_HOSTNAMES)
# - sites clients = /var/lib/vzone/nginx/domains/*.conf (server_name précis)

upstream vzone_asgi {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Parking / catch-all — default_server (Host inconnu)
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vzone/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        default_type text/html;
        return 404 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Site not configured</title></head><body style="font-family:system-ui;padding:2rem"><h1>Site not configured</h1><p>No website is configured for this hostname on this V-zone server.</p></body></html>';
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        default_type text/html;
        return 404 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Site not configured</title></head><body style="font-family:system-ui;padding:2rem"><h1>Site not configured</h1><p>No website is configured for this hostname on this V-zone server.</p></body></html>';
    }
}

# ---------------------------------------------------------------------------
# Panel (HTTP) — IP / localhost / hostnames panel UNIQUEMENT
# __PANEL_SERVER_NAMES__ remplacé par ensure-nginx.sh (sans « _ »)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __PANEL_SERVER_NAMES__;

    client_max_body_size 2048m;
    client_body_timeout 3600s;

    root /opt/vzone/frontend/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vzone/acme;
        default_type "text/plain";
        allow all;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /api/v1/files/upload/ {
        proxy_pass http://vzone_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 2048m;
        client_body_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://vzone_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /ws/ {
        proxy_pass http://vzone_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /admin/ {
        proxy_pass http://vzone_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/vzone/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    include /etc/nginx/snippets/vzone-phpmyadmin.inc;
    include /etc/nginx/snippets/vzone-roundcube.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}

# ---------------------------------------------------------------------------
# Panel (HTTPS)
# ---------------------------------------------------------------------------
