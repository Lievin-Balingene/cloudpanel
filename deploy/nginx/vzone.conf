# V-zone Panel — Nginx
# Généré/installé par ensure-nginx.sh
# - default_server : page parking (PAS le panel) pour les hôtes inconnus
# - server panel : SPA + API uniquement pour VZONE_PANEL_HOSTNAMES
# - domaines clients : /var/lib/vzone/nginx/domains/*.conf

upstream vzone_asgi {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Catch-all : ne JAMAIS servir le panel ici (évite login sur les sites clients)
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 8m;

    # ACME HTTP-01 (Let's Encrypt)
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vzone/acme;
        default_type "text/plain";
        allow all;
    }

    root /var/lib/vzone/parking;
    index index.html;

    location / {
        try_files $uri /index.html =404;
    }
}

# Catch-all HTTPS : page parking (PAS le panel).
# Certificat snakeoil — les vhosts domaines/panel ont leurs propres certs (SNI).
# Note: pas de ssl_reject_handshake (incompatible Nginx 1.18 / Ubuntu 22.04).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/lib/vzone/parking;
    index index.html;

    location / {
        try_files $uri /index.html =404;
    }
}

# ---------------------------------------------------------------------------
# Panneau de contrôle (hostname dédié)
# Placeholders remplacés par ensure-nginx.sh :
#   __PANEL_SERVER_NAMES__  ex: vpanel.example.com 127.0.0.1
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __PANEL_SERVER_NAMES__;

    client_max_body_size 128m;

    root /opt/vzone/frontend/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vzone/acme;
        default_type "text/plain";
        allow all;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://vzone_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://vzone_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /admin/ {
        proxy_pass http://vzone_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/vzone/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    include /etc/nginx/snippets/vzone-phpmyadmin.inc;
    include /etc/nginx/snippets/vzone-roundcube.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Bloc HTTPS panel (activé par ensure-nginx.sh si certificats présents)
# __PANEL_SSL_SERVER__
