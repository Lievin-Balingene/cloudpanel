# V-zone Panel — Nginx (compatible 1.18)
# - default_server = panel (accès IP + hostnames panel)
# - domaines clients : server_name précis dans /var/lib/vzone/nginx/domains/*.conf
#   (priorité Nginx sur le default_server)

upstream vzone_asgi {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Panel (HTTP) — default_server pour accès via IP
# __PANEL_SERVER_NAMES__ remplacé par ensure-nginx.sh
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __PANEL_SERVER_NAMES__;

    client_max_body_size 2048m;
    client_body_timeout 3600s;

    root /opt/vzone/frontend/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vzone/acme;
        default_type "text/plain";
        allow all;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploads File Manager : pas de buffer request, timeouts longs (gros fichiers / liens lents)
    location ^~ /api/v1/files/upload/ {
        proxy_pass http://vzone_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 2048m;
        client_body_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://vzone_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /ws/ {
        proxy_pass http://vzone_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /admin/ {
        proxy_pass http://vzone_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/vzone/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    include /etc/nginx/snippets/vzone-phpmyadmin.inc;
    include /etc/nginx/snippets/vzone-roundcube.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# Panel (HTTPS) — default_server ; certificats injectés par ensure-nginx.sh
# Placeholders : __SSL_CERTIFICATE__  __SSL_CERTIFICATE_KEY__
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __PANEL_SERVER_NAMES__;

    client_max_body_size 2048m;
    client_body_timeout 3600s;

    ssl_certificate     __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/vzone/frontend/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
