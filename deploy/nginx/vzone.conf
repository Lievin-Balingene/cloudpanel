# V-zone Panel — Nginx
# - :80/:443 default_server = Access Denied (IP nue / Host inconnu) — style cPanel
# - panel hostname = VZONE_PANEL_HOSTNAMES (pas l'IP publique)
# - ports dédiés = zz-vzone-ports.conf (Admin 9086, Client 9082, Webmail 9095)

upstream vzone_asgi {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Access Denied — IP directe / hostname non configuré (comme cPanel)
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vzone/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 403;
    }

    error_page 403 /access-denied.html;
    location = /access-denied.html {
        root /var/lib/vzone/nginx;
        internal;
        default_type text/html;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 403;
    }

    error_page 403 /access-denied.html;
    location = /access-denied.html {
        root /var/lib/vzone/nginx;
        internal;
        default_type text/html;
    }
}

# ---------------------------------------------------------------------------
# Panel sur hostname (HTTP) — PAS l'IP publique
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __PANEL_SERVER_NAMES__;

    set $vzone_portal "shared";
    set $vzone_api_host $host;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vzone/acme;
        default_type "text/plain";
        allow all;
    }

    include /etc/nginx/snippets/vzone-panel-app.inc;
    include /etc/nginx/snippets/vzone-roundcube.inc;
}

# ---------------------------------------------------------------------------
# Panel sur hostname (HTTPS)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __PANEL_SERVER_NAMES__;

    set $vzone_portal "shared";
    set $vzone_api_host $host;

    ssl_certificate     __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vzone/acme;
        default_type "text/plain";
        allow all;
    }

    include /etc/nginx/snippets/vzone-panel-app.inc;
    include /etc/nginx/snippets/vzone-roundcube.inc;
}
