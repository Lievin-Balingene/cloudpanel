<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account Suspended / Site Not Configured</title>
  <style>
    body { font-family: Georgia, serif; background: #f4f6f8; color: #1a2332; margin: 0; }
    main { max-width: 36rem; margin: 12vh auto; padding: 2rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
    p { color: #5a6577; line-height: 1.5; }
    code { font-size: 0.9em; }
  </style>
</head>
<body>
  <main>
    <h1>This domain is not configured</h1>
    <p>
      No website is published for this hostname yet. If you manage this server,
      open the control panel and add or enable the domain.
    </p>
  </main>
</body>
</html>
