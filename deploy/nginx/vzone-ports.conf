# Ports dédiés V-zone (différents de cPanel)
# Admin  : __VZONE_ADMIN_PORT__   (défaut 9086) — comptes admin/reseller uniquement
# Client : __VZONE_CLIENT_PORT__  (défaut 9082) — comptes client uniquement
# Webmail: __VZONE_WEBMAIL_PORT__ (défaut 9095)

# --- Admin ---
server {
    listen __VZONE_ADMIN_PORT__ default_server;
    listen [::]:__VZONE_ADMIN_PORT__ default_server;
    server_name _;

    set $vzone_portal "admin";

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vzone/acme;
        default_type "text/plain";
        allow all;
    }

    # Pas d'espace client sur le port Admin
    location ^~ /panel {
        default_type text/html;
        return 403 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Port Admin</title></head><body style="font-family:system-ui;padding:2rem"><h1>Port réservé à l’administration</h1><p>Connectez-vous avec un compte Admin sur ce port. L’espace client est sur le port <code>9082</code>.</p></body></html>';
    }

    location = / {
        return 302 /whm;
    }

    include /etc/nginx/snippets/vzone-panel-app.inc;
    include /etc/nginx/snippets/vzone-roundcube.inc;
}

# --- Client ---
server {
    listen __VZONE_CLIENT_PORT__ default_server;
    listen [::]:__VZONE_CLIENT_PORT__ default_server;
    server_name _;

    set $vzone_portal "client";

    # Pas d’Admin sur le port Client
    location ^~ /whm {
        default_type text/html;
        return 403 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Port Client</title></head><body style="font-family:system-ui;padding:2rem"><h1>Port réservé aux comptes d’hébergement</h1><p>L’administration est sur le port <code>9086</code>.</p></body></html>';
    }

    location = / {
        return 302 /panel;
    }

    include /etc/nginx/snippets/vzone-panel-app.inc;
}

# --- Webmail ---
server {
    listen __VZONE_WEBMAIL_PORT__ default_server;
    listen [::]:__VZONE_WEBMAIL_PORT__ default_server;
    server_name _;

    set $vzone_portal "webmail";
    client_max_body_size 64m;

    location = / {
        return 302 /webmail/;
    }

    include /etc/nginx/snippets/vzone-roundcube.inc;

    location / {
        default_type text/html;
        return 403 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Webmail only</title></head><body style="font-family:system-ui;padding:2rem"><h1>Webmail</h1><p>Ce port sert uniquement le webmail. Ouvrez <a href="/webmail/">/webmail/</a>.</p></body></html>';
    }
}
