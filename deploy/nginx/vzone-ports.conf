# Ports dédiés V-zone — style cPanel :
#   https?://NIMPORTE_DOMAINE:9086 → Admin (WHM)
#   https?://NIMPORTE_DOMAINE:9082 → Client (panel)
#   https?://NIMPORTE_DOMAINE:9095 → Webmail
# default_server + server_name _ = tous les Host (domaines hébergés inclus).
# Host backend Django = __PANEL_BACKEND_HOST__ (évite DisallowedHost).

# --- Admin ---
server {
    listen __VZONE_ADMIN_PORT__ default_server;
    listen [::]:__VZONE_ADMIN_PORT__ default_server;
    server_name _;

    set $vzone_portal "admin";
    set $vzone_api_host "__PANEL_BACKEND_HOST__";

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vzone/acme;
        default_type "text/plain";
        allow all;
    }

    location ^~ /panel {
        default_type text/html;
        return 403 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Port Admin</title></head><body style="font-family:system-ui;padding:2rem"><h1>Port réservé à l’administration</h1><p>Espace client : port <code>9082</code>.</p></body></html>';
    }

    location = / {
        return 302 /whm;
    }

    include /etc/nginx/snippets/vzone-panel-app.inc;
    include /etc/nginx/snippets/vzone-roundcube.inc;
}

# --- Client ---
server {
    listen __VZONE_CLIENT_PORT__ default_server;
    listen [::]:__VZONE_CLIENT_PORT__ default_server;
    server_name _;

    set $vzone_portal "client";
    set $vzone_api_host "__PANEL_BACKEND_HOST__";

    location ^~ /whm {
        default_type text/html;
        return 403 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Port Client</title></head><body style="font-family:system-ui;padding:2rem"><h1>Port réservé aux comptes d’hébergement</h1><p>Administration : port <code>9086</code>.</p></body></html>';
    }

    location = / {
        return 302 /panel;
    }

    include /etc/nginx/snippets/vzone-panel-app.inc;
}

# --- Webmail ---
server {
    listen __VZONE_WEBMAIL_PORT__ default_server;
    listen [::]:__VZONE_WEBMAIL_PORT__ default_server;
    server_name _;

    set $vzone_portal "webmail";
    set $vzone_api_host "__PANEL_BACKEND_HOST__";
    client_max_body_size 64m;

    location = / {
        return 302 /webmail/;
    }

    include /etc/nginx/snippets/vzone-roundcube.inc;

    location / {
        default_type text/html;
        return 403 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Webmail only</title></head><body style="font-family:system-ui;padding:2rem"><h1>Webmail</h1><p>Ouvrez <a href="/webmail/">/webmail/</a>.</p></body></html>';
    }
}
