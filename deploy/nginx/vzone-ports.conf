# Ports dédiés V-zone (différents de cPanel)
# Admin  : __VZONE_ADMIN_PORT__   (défaut 9086)
# Client : __VZONE_CLIENT_PORT__  (défaut 9082)
# Webmail: __VZONE_WEBMAIL_PORT__ (défaut 9095)
# Accès par IP:port autorisé ici. Sur :80/:443 IP seule → access-denied.

# --- Admin (équivalent WHM, rebrand V-zone Admin) ---
server {
    listen __VZONE_ADMIN_PORT__ default_server;
    listen [::]:__VZONE_ADMIN_PORT__ default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vzone/acme;
        default_type "text/plain";
        allow all;
    }

    location = / {
        return 302 /whm;
    }

    include /etc/nginx/snippets/vzone-panel-app.inc;
    include /etc/nginx/snippets/vzone-roundcube.inc;
}

# --- Client (espace hébergement) ---
server {
    listen __VZONE_CLIENT_PORT__ default_server;
    listen [::]:__VZONE_CLIENT_PORT__ default_server;
    server_name _;

    location = / {
        return 302 /panel;
    }

    include /etc/nginx/snippets/vzone-panel-app.inc;
}

# --- Webmail ---
server {
    listen __VZONE_WEBMAIL_PORT__ default_server;
    listen [::]:__VZONE_WEBMAIL_PORT__ default_server;
    server_name _;

    client_max_body_size 64m;

    location = / {
        return 302 /webmail/;
    }

    include /etc/nginx/snippets/vzone-roundcube.inc;

    location / {
        default_type text/html;
        return 403 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Webmail only</title></head><body style="font-family:system-ui;padding:2rem"><h1>Webmail</h1><p>Ce port sert uniquement le webmail. Ouvrez <a href="/webmail/">/webmail/</a>.</p></body></html>';
    }
}
