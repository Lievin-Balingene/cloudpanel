services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vzone
      POSTGRES_USER: vzone
      POSTGRES_PASSWORD: vzone_dev_password
    ports:
      - "5432:5432"
    volumes:
      - vzone_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vzone -d vzone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - vzone_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles:
      - mail

volumes:
  vzone_pg_data:
  vzone_redis_data:
