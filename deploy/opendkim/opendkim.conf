# OpenDKIM — V-zone
# Mode signature seule. On-*=accept → JAMAIS de 451 SMTP si erreur interne.
Syslog                  yes
SyslogSuccess           yes
LogWhy                  yes
Canonicalization        relaxed/relaxed
Mode                    s
SubDomains              no
AutoRestart             yes
AutoRestartRate         10/1M
Background              yes
DNSTimeout              3
SignatureAlgorithm      rsa-sha256

# Tables locales (pas sous /var/lib — permissions fiables)
KeyTable                /etc/opendkim/KeyTable
SigningTable            refile:/etc/opendkim/SigningTable
ExternalIgnoreList      /etc/opendkim/TrustedHosts
InternalHosts           /etc/opendkim/TrustedHosts

# Socket TCP local (évite les soucis de groupe unix socket / UMask)
Socket                  inet:8891@127.0.0.1
PidFile                 /run/opendkim/opendkim.pid
UserID                  opendkim:opendkim
UMask                   002

OversignHeaders         From
SoftwareHeader          yes

# Clés en 600 (owner only). Le groupe opendkim a vzone/postfix → RequireSafeKeys
# refuserait sinon (« key data is not secure » / error loading key).
RequireSafeKeys         no

# Critique: ne jamais tempfail → Roundcube « SMTP service unavailable »
On-Default              accept
On-InternalError        accept
On-KeyNotFound          accept
On-NoSignature          accept
On-Security             accept
