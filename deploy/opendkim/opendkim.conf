# OpenDKIM — V-zone Panel
Syslog                  yes
SyslogSuccess           yes
LogWhy                  yes
Canonicalization        relaxed/simple
Mode                    sv
SubDomains              no
AutoRestart             yes
AutoRestartRate         10/1M
Background              yes
DNSTimeout              5
SignatureAlgorithm      rsa-sha256

# Tables générées par le panel (pas de copie /etc — l’API n’est pas root)
KeyTable                __MAPS_DIR__/opendkim-KeyTable
SigningTable            refile:__MAPS_DIR__/opendkim-SigningTable
ExternalIgnoreList      /etc/opendkim/TrustedHosts
InternalHosts           /etc/opendkim/TrustedHosts

Socket                  inet:8891@127.0.0.1
PidFile                 /run/opendkim/opendkim.pid
UserID                  opendkim:opendkim
UMask                   007

OversignHeaders         From
