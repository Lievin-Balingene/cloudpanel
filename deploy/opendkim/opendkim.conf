# OpenDKIM — V-zone (signature seule — ne bloque pas le SMTP)
Syslog                  yes
SyslogSuccess           yes
LogWhy                  yes
Canonicalization        relaxed/relaxed
Mode                    s
SubDomains              no
AutoRestart             yes
AutoRestartRate         10/1M
Background              yes
DNSTimeout              3
SignatureAlgorithm      rsa-sha256

KeyTable                __MAPS_DIR__/opendkim-KeyTable
SigningTable            refile:__MAPS_DIR__/opendkim-SigningTable
ExternalIgnoreList      /etc/opendkim/TrustedHosts
InternalHosts           /etc/opendkim/TrustedHosts

# Socket Unix (plus fiable que inet pour Postfix)
Socket                  local:/var/spool/postfix/opendkim/opendkim.sock
PidFile                 /run/opendkim/opendkim.pid
UserID                  opendkim:opendkim
UMask                   007

OversignHeaders         From
SoftwareHeader          yes
